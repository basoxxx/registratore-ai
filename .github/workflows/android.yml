# Nome file invariato di proposito: il numero di build (run_number) continua a crescere
# ed è usato come versione dell'app per gli aggiornamenti automatici.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore di firma (opzionale, dai secret del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Test
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Rinomina APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/RegistratoreLezioni-1.0.${{ github.run_number }}.apk
          # Nome fisso: il sito scarica sempre releases/latest/download/RegistratoreLezioni.apk
          cp app/build/outputs/apk/release/app-release.apk dist/RegistratoreLezioni.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      SKIP_ANDROID: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Libreria nativa whisper.cpp
        run: |
          cmake -S desktop/native -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --config Release -j 4
          mkdir -p desktop/resources/${{ matrix.target }}
          # whisper_jni + (su Windows) whisper/ggml e le varianti CPU ggml-cpu-*
          find build-native/out -maxdepth 1 \( -name "*.dll" -o -name "*.dylib" -o -name "*.so" \) -exec cp {} desktop/resources/${{ matrix.target }}/ \;
          ls -la desktop/resources/${{ matrix.target }}

      - name: Pacchetto macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          ./gradlew :desktop:createDistributable --console=plain
          APP="desktop/build/compose/binaries/main/app/Registratore Lezioni.app"
          # Firma ad-hoc (non serve un account sviluppatore Apple)
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg dist
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Registratore Lezioni" -srcfolder dmg -ov -format UDZO dist/RegistratoreLezioni-macOS.dmg

      - name: Installer Windows (.msi)
        if: runner.os == 'Windows'
        run: |
          ./gradlew :desktop:packageMsi --console=plain
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi dist/RegistratoreLezioni-Windows.msi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*

  release:
    # Pubblica la release (usata dal sito e dagli aggiornamenti automatici) anche se
    # una delle build desktop dovesse fallire: l'APK Android non resta mai bloccato.
    needs: [android, desktop]
    if: always() && needs.android.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Registratore Lezioni 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: dist/*
          make_latest: true
