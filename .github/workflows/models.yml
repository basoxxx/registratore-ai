name: Modelli Whisper

# Pubblica i modelli di trascrizione come file della release "models" di questo repository:
# le app scaricano i modelli solo da qui. (I file superano il limite di 100 MB di git,
# mentre gli allegati delle release arrivano a 2 GB.) Va eseguito una volta, o per aggiornarli.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/models.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Scarica i modelli ufficiali whisper.cpp
        run: |
          mkdir models && cd models
          # ggml-large-v3-turbo-q5_0.bin resta per le versioni dell'app fino alla 1.0.9
          for f in ggml-tiny-q5_1.bin ggml-base-q5_1.bin ggml-small-q5_1.bin ggml-large-v3-turbo-q5_0.bin; do
            curl -fL --retry 5 --retry-delay 5 -o "$f" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$f"
          done

      - name: Large v3 Turbo in Q4_0 (circa 2,4x più veloce su CPU)
        run: |
          cmake -S third_party/whisper.cpp -B qbuild -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_SDL2=OFF -DGGML_OPENMP=OFF
          cmake --build qbuild -j 4 --target quantize
          curl -fL --retry 5 --retry-delay 5 -o turbo-f16.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin"
          qbuild/bin/quantize turbo-f16.bin models/ggml-large-v3-turbo-q4_0.bin q4_0
          rm turbo-f16.bin
          cd models && sha256sum *.bin > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          target_commitish: main
          name: Modelli di trascrizione (Whisper)
          body: |
            Modelli Whisper (formato ggml di whisper.cpp) scaricati dalle app Registratore Lezioni.
            Large v3 Turbo è anche in formato Q4_0, generato da questo workflow: su CPU è circa
            2,4 volte più veloce del Q5_0 con la stessa precisione.
            Non è una versione dell'app: per installare l'app usa l'ultima release.
          files: models/*
          prerelease: true
          make_latest: false
